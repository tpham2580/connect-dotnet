syntax = "proto3";

import "google/protobuf/field_mask.proto";
option csharp_namespace = "Grpc.BusinessService";
package business.v1;

service BusinessService {
  rpc CreateBusiness(CreateBusinessRequest) returns (BusinessResponse);
  rpc GetBusinessById(BusinessByIdRequest) returns (BusinessResponse);
  rpc GetAllBusinessesByIds(BusinessesByIdsRequest) returns (GetAllBusinessesByIdsResponse);
  rpc ListBusinesses(ListBusinessesRequest) returns (ListBusinessesResponse);
  rpc UpdateBusiness(UpdateBusinessRequest) returns (BusinessResponse);
  rpc DeleteBusiness(BusinessByIdRequest) returns (DeleteItemByIdResponse);
}

message Business {
  int64 id = 1;
  string name = 2;
  string address = 3;
  string city = 4;
  string state = 5;
  string country = 6;
  double latitude = 7;
  double longitude = 8;
}

message newBusiness {
  string name = 1;
  string address = 2;
  string city = 3;
  string state = 4;
  string country = 5;
  double latitude = 6;
  double longitude = 7;
}

message BusinessResponse {
  Business business = 1;
}

message CreateBusinessRequest {
  newBusiness business = 1;
}

message BusinessByIdRequest {
  int64 id = 1;
}

message BusinessesByIdsRequest {
  repeated int64 ids = 1;
}

message GetAllBusinessesByIdsResponse {
  repeated Business businesses = 1;
}

message ListBusinessesRequest {
  // Maximum number of businesses to return. Values <= 0 use the server default;
  // values above the server maximum are capped.
  int32 limit = 1;
  // Exclusive keyset cursor: only businesses with id > after are returned.
  // 0 starts from the beginning.
  int64 after = 2;
}

message ListBusinessesResponse {
  repeated Business businesses = 1;
  int64 total = 2;
  // Value to pass as `after` to fetch the next page. Only meaningful when has_more is true.
  int64 next_cursor = 3;
  bool has_more = 4;
}

message UpdateBusinessRequest {
  Business business = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message DeleteItemByIdResponse {
  bool success = 1;
}
